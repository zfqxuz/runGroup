name: Deploy App (ECS + Docker + GHCR)

on:
  push:
    branches: [main]
    paths-ignore:
      - "n8n/**"
      - ".github/workflows/deploy-n8n.yml"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "是否执行 prisma migrate deploy（首次数据迁移/恢复时请取消勾选）"
        required: true
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/touhou-trpg' }}
  APP_SLUG: touhou-trpg

jobs:
  # ---------- 1. 质量门禁：类型 + 测试 ----------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate --schema apps/web/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test --workspaces --if-present

  # ---------- 2. 构建镜像并推送到 GHCR ----------
  build-and-push:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${REPO}"
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3. 只部署 app + db，不碰 n8n ----------
  # n8n 工作流和容器由独立 workflow deploy-n8n.yml 负责。
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync app compose to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true
          strip_components: 0
          timeout: 60s

      - name: Deploy app to ECS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 30m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DEEPSEEK_API_KEY,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env
            test -f docker-compose.prod.yml

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi

            if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
              if grep -q '^DEEPSEEK_API_KEY=' .env; then
                sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY|" .env
              else
                echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> .env
              fi
            fi

            docker compose -f docker-compose.prod.yml pull app

            # 关键：只处理 db 和 app，不动 n8n / n8n-proxy。
            # db 是独立数据卷，仅在停掉时拉起；n8n 是独立 deploy-n8n.yml 的职责。
            docker compose -f docker-compose.prod.yml up -d --no-deps db
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker compose -f docker-compose.prod.yml ps

            for i in $(seq 1 36); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                node -e "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                echo "app health check passed"
                docker logout ghcr.io >/dev/null 2>&1 || true
                exit 0
              fi
              echo "waiting for app health... ($i/36)"
              sleep 5
            done
            docker logout ghcr.io >/dev/null 2>&1 || true
            echo "app health check failed"
            exit 1

      # 默认每次部署都执行 Prisma 迁移（幂等）。
      # 首次数据迁移请手动触发 workflow 并取消勾选 run_migrations，
      # 恢复完 pg_dump 后再让应用启动。
      - name: Prisma migrate deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_DIR }}"
            docker compose -f docker-compose.prod.yml exec -T app \
              npx prisma migrate deploy --schema apps/web/prisma/schema.prisma
