name: Deploy App (ECS + Docker + Aliyun ACR)

on:
  push:
    branches: [main]
    paths-ignore:
      - "n8n/**"
      - ".github/workflows/deploy-n8n.yml"
      # 纯文档/示例改动不重新构建部署。
      - "**/*.md"
      - "**/*.example"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "是否执行 prisma migrate deploy（首次数据迁移/恢复时请取消勾选）"
        required: true
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/touhou-trpg' }}
  APP_SLUG: touhou-trpg
  # 阿里云容器镜像服务（华东1 杭州）。ECS 在北京，VPC 不通，默认用公网地址拉取；
  # 若以后 ECS 与 ACR 同地域，把仓库 Variable ACR_PULL_REGISTRY 覆盖成 VPC 地址即可。
  ACR_REGISTRY: crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY || 'crpi-nqwu6u57qjindq7p.cn-hangzhou.personal.cr.aliyuncs.com' }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY || 'touhou-trpg/touhou-trpg' }}

jobs:
  # ---------- 1. 质量门禁：类型 + 测试 ----------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate --schema apps/web/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test --workspaces --if-present

  # ---------- 2. 构建镜像并推送到阿里云 ACR ----------
  build-and-push:
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      pull_image: ${{ steps.meta.outputs.pull_image }}
      dsh_image: ${{ steps.meta.outputs.dsh_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: |
          IMAGE="${ACR_REGISTRY}/${ACR_REPOSITORY}"
          PULL_IMAGE="${ACR_PULL_REGISTRY}/${ACR_REPOSITORY}"
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${PULL_IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          # dsh sidecar 复用同一个 ACR 仓库，用 dsh-* tag 区分 app 镜像。
          echo "dsh_push_image=${IMAGE}:dsh-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "dsh_push_latest=${IMAGE}:dsh-latest" >> "$GITHUB_OUTPUT"
          echo "dsh_image=${PULL_IMAGE}:dsh-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # ACR 个人版不支持 buildx 的 OCI 证明清单（application/vnd.oci.empty.v1+json），
          # 必须关掉 provenance / SBOM。
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # dsh sidecar：在 CI 构建并推 ACR；ECS 只 pull，禁止在生产主机上 npm install。
      - uses: docker/build-push-action@v6
        with:
          context: ops/dsh-service
          file: ops/dsh-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.dsh_push_image }}
            ${{ steps.meta.outputs.dsh_push_latest }}
          cache-from: type=gha,scope=dsh
          cache-to: type=gha,mode=max,scope=dsh

  # ---------- 3. 只部署 app + db，不碰 n8n ----------
  # n8n 工作流和容器由独立 workflow deploy-n8n.yml 负责。
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync app compose to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true
          strip_components: 0
          timeout: 60s

      - name: Deploy app to ECS over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.pull_image }}
          DSH_IMAGE: ${{ needs.build-and-push.outputs.dsh_image }}
          ACR_PULL_REGISTRY: ${{ env.ACR_PULL_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 30m
          envs: APP_IMAGE,DSH_IMAGE,ACR_PULL_REGISTRY,ACR_USERNAME,ACR_PASSWORD,DEEPSEEK_API_KEY,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"
            test -f .env
            test -f docker-compose.prod.yml

            # ACR 仓库是公开的，匿名也能拉；有凭证时优先登录。
            if [ -n "${ACR_PASSWORD:-}" ] && [ -n "${ACR_USERNAME:-}" ]; then
              echo "$ACR_PASSWORD" | docker login "$ACR_PULL_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            fi

            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi

            if [ -n "${DSH_IMAGE:-}" ]; then
              if grep -q '^DSH_IMAGE=' .env; then
                sed -i "s|^DSH_IMAGE=.*|DSH_IMAGE=$DSH_IMAGE|" .env
              else
                echo "DSH_IMAGE=$DSH_IMAGE" >> .env
              fi
            fi

            if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
              if grep -q '^DEEPSEEK_API_KEY=' .env; then
                sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY|" .env
              else
                echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> .env
              fi
            fi

            docker compose -f docker-compose.prod.yml pull app
            # dsh 旁车镜像由本 workflow 构建推送；ECS 只 pull，绝不 build。
            docker compose -f docker-compose.prod.yml pull dsh

            # 关键：只处理 db / app / dsh，不动 n8n / n8n-proxy。
            # db 是独立数据卷，仅在停掉时拉起；n8n 是独立 deploy-n8n.yml 的职责。
            docker compose -f docker-compose.prod.yml up -d --no-deps db
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker compose -f docker-compose.prod.yml up -d --no-deps dsh
            docker compose -f docker-compose.prod.yml ps

            # dsh sidecar health check：只打 /health，不触发真实 dsh 任务。
            dsh_ready=0
            for i in $(seq 1 20); do
              if docker compose -f docker-compose.prod.yml exec -T dsh \
                node -e "fetch('http://127.0.0.1:8790/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                dsh_ready=1
                break
              fi
              echo "waiting for dsh sidecar... ($i/20)"
              sleep 3
            done
            if [ "$dsh_ready" != "1" ]; then
              echo "dsh sidecar health check failed"
              docker compose -f docker-compose.prod.yml logs --tail=100 dsh || true
              exit 1
            fi
            echo "dsh sidecar health check passed"

            for i in $(seq 1 36); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                node -e "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                echo "app health check passed"
                [ -n "${ACR_PASSWORD:-}" ] && docker logout "$ACR_PULL_REGISTRY" >/dev/null 2>&1 || true
                exit 0
              fi
              echo "waiting for app health... ($i/36)"
              sleep 5
            done
            [ -n "${ACR_PASSWORD:-}" ] && docker logout "$ACR_PULL_REGISTRY" >/dev/null 2>&1 || true
            echo "app health check failed"
            exit 1

      # 默认每次部署都执行 Prisma 迁移（幂等）。
      # 首次数据迁移请手动触发 workflow 并取消勾选 run_migrations，
      # 恢复完 pg_dump 后再让应用启动。
      - name: Prisma migrate deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_DIR }}"
            docker compose -f docker-compose.prod.yml exec -T app \
              npx prisma migrate deploy --schema apps/web/prisma/schema.prisma

  # ---------- 4. 邮件通知（成功 / 失败） ----------
  # 需要仓库 Secrets：MAIL_USERNAME（邮箱）、MAIL_PASSWORD（SMTP 授权码）、MAIL_TO（收件人）
  # 可选 Variables：MAIL_SERVER（默认 smtp.qq.com）、MAIL_PORT（默认 465）、MAIL_FROM
  notify:
    needs: [build-and-push, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        if: ${{ needs.deploy.result == 'success' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER || 'smtp.qq.com' }}
          server_port: ${{ vars.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ vars.MAIL_FROM || secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "✅ 部署成功 · runGroup · ${{ github.sha }}"
          convert_markdown: true
          body: |
            ## ✅ runGroup 部署成功

            - **仓库**：[${{ github.repository }}](https://github.com/${{ github.repository }})
            - **分支**：`${{ github.ref_name }}`
            - **提交**：`${{ github.sha }}`
            - **提交说明**：${{ github.event.head_commit.message }}
            - **镜像**：`${{ needs.build-and-push.outputs.image }}`
            - **运行记录**：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            生产 app 健康检查已通过。

      - name: Send failure email
        if: ${{ needs.deploy.result != 'success' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER || 'smtp.qq.com' }}
          server_port: ${{ vars.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ vars.MAIL_FROM || secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "❌ 部署失败 · runGroup · ${{ github.sha }}"
          convert_markdown: true
          body: |
            ## ❌ runGroup 部署失败

            - **仓库**：[${{ github.repository }}](https://github.com/${{ github.repository }})
            - **分支**：`${{ github.ref_name }}`
            - **提交**：`${{ github.sha }}`
            - **提交说明**：${{ github.event.head_commit.message }}
            - **运行记录**：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            请打开运行记录查看失败步骤与日志。
