# 阿里云 ECS 单机生产部署：应用 + PostgreSQL + n8n 都在 Docker 里。
# 使用前提：
#   1. 服务器 /opt/touhou-trpg/.env 写好生产变量（参考 apps/web/.env.production.example）
#   2. 服务器已 docker login 过 ACR（GitHub Actions 部署时会自动 login）
#   3. 应用镜像由 GitHub Actions 构建并推送，服务器只 pull 运行
services:
  db:
    image: postgres:16-alpine
    container_name: touhou-trpg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-touhou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-touhou_trpg}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-touhou} -d ${POSTGRES_DB:-touhou_trpg}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 生产默认不把 5432 暴露到公网。只在服务器本机备份时可改为：
    # ports:
    #   - "127.0.0.1:5433:5432"

  n8n:
    image: ${N8N_IMAGE:-docker.m.daocloud.io/n8nio/n8n:2.39.5}
    container_name: touhou-trpg-n8n
    restart: unless-stopped
    # 只在本机回环暴露 n8n 编辑器；工作流由应用通过 Docker 内网地址访问。
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # 公网可视化入口由 n8n-proxy(Caddy) 提供；webhook 仍走 Docker 内网，避免应用侧改地址。
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-https://8.141.16.85}
      WEBHOOK_URL: http://n8n:5678
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PAYLOAD_SIZE_MAX: "200"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_TIMEOUT: "7200"
      EXECUTIONS_TIMEOUT_MAX: "7200"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY，n8n 工作流需要它调用模型}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    # 每次启动先导入并发布工作流，再启动 n8n。webhook 路径固定为 /webhook/module-parse。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:workflow --input=/workflows/module-import.json || true;
        n8n publish:workflow --id=touhou-module-import || true;
        exec n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n-proxy:
    image: ${CADDY_IMAGE:-docker.m.daocloud.io/library/caddy:2-alpine}
    container_name: touhou-trpg-n8n-proxy
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    ports:
      # 只暴露 HTTPS；n8n 本身仍然只监听 127.0.0.1:5678。
      - "443:443"
    volumes:
      - ./n8n/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    image: ${APP_IMAGE:?请在 .env 中设置 APP_IMAGE}
    container_name: touhou-trpg-app
    restart: unless-stopped
    # 与 Dockerfile 中固定 UID 保持一致；绑定的 ./uploads 需要 chown 成 10001:10001
    user: "10001:10001"
    depends_on:
      db:
        condition: service_healthy
      n8n:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      UPLOAD_DIR: /data/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:-touhou}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-touhou_trpg}?schema=public
      N8N_MODULE_PARSE_URL: ${N8N_MODULE_PARSE_URL:-http://n8n:5678/webhook/module-parse}
      N8N_REQUEST_TIMEOUT_MS: ${N8N_REQUEST_TIMEOUT_MS:-1800000}
    ports:
      # 首次切换先直出公网 IP:3000，方便验证；后续挂 Nginx / HTTPS 后
      # 建议改成 "127.0.0.1:3000:3000" 并只在安全组放行 80/443。
      - "3000:3000"
    volumes:
      - ./uploads:/data/uploads

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
