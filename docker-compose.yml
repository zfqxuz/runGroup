services:
  db:
    image: postgres:16-alpine
    container_name: touhou-trpg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: touhou
      POSTGRES_PASSWORD: touhou
      POSTGRES_DB: touhou_trpg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touhou -d touhou_trpg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
